
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Phantom FF League</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --purple: #7C3AED;
            --purple-dark: #5B21B6;
            --purple-light: #A78BFA;
            --pink: #EC4899;
            --black: #0F0F0F;
            --black-light: #1A1A1A;
            --black-card: #222222;
            --white: #FFFFFF;
            --gray: #9CA3AF;
            --gray-light: #D1D5DB;
            --border: rgba(124, 58, 237, 0.2);
            --border-hover: rgba(124, 58, 237, 0.5);
            --glow: rgba(124, 58, 237, 0.4);
            --glow-strong: rgba(124, 58, 237, 0.6);
            --success: #10B981;
            --error: #EF4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(124, 58, 237, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124, 58, 237, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(60px); }
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: orbFloat 8s ease-in-out infinite;
        }

        .bg-orb-1 {
            width: 500px;
            height: 500px;
            background: var(--purple);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-orb-2 {
            width: 400px;
            height: 400px;
            background: var(--pink);
            bottom: -100px;
            left: -100px;
            animation-delay: -4s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Main Container */
        .login-wrapper {
            width: 100%;
            max-width: 1000px;
            display: flex;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 60px rgba(124, 58, 237, 0.15);
            position: relative;
            z-index: 1;
            margin: 20px;
        }

        /* Left Panel - Brand */
        .login-brand {
            flex: 1;
            background: linear-gradient(135deg, #1A1025, #0F0720);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-right: 1px solid var(--border);
        }

        .login-brand::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(124, 58, 237, 0.15), transparent 70%);
        }

        .brand-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            border: 3px solid var(--purple);
            box-shadow: 0 0 40px var(--glow);
            margin-bottom: 30px;
            animation: logoFloat 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .brand-title span {
            color: var(--purple-light);
        }

        .brand-subtitle {
            color: var(--gray);
            font-size: 14px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .brand-features {
            margin-top: 50px;
            position: relative;
            z-index: 1;
        }

        .brand-feature {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: var(--gray-light);
            font-size: 14px;
        }

        .brand-feature i {
            color: var(--purple-light);
            font-size: 18px;
        }

        /* Right Panel - Form */
        .login-form-panel {
            flex: 1;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(30px);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-header p {
            color: var(--gray);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gray);
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
        }

        .input-group .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--purple);
            font-size: 16px;
            transition: all 0.3s;
            z-index: 2;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(34, 34, 34, 0.8);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--white);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: #555;
        }

        .input-group input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 20px var(--glow);
            background: rgba(34, 34, 34, 0.95);
        }

        .input-group input:focus ~ .icon {
            color: var(--purple-light);
        }

        .input-group .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            cursor: pointer;
            transition: color 0.3s;
            z-index: 2;
        }

        .input-group .toggle-password:hover {
            color: var(--purple-light);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            cursor: pointer;
        }

        .remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--purple);
            cursor: pointer;
        }

        .forgot-link {
            color: var(--purple-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--white);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-submit:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px var(--glow-strong);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 14px 18px;
            border-radius: 10px;
            color: var(--error);
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-alert {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 14px 18px;
            border-radius: 10px;
            color: var(--success);
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
        }

        .form-footer {
            text-align: center;
            margin-top: 30px;
            color: var(--gray);
            font-size: 14px;
        }

        .form-footer a {
            color: var(--purple-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .form-footer a:hover {
            color: var(--white);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            text-decoration: none;
            font-size: 13px;
            margin-top: 20px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--white);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 450px;
            }
            
            .login-brand {
                padding: 40px 30px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            
            .brand-logo {
                width: 70px;
                height: 70px;
                margin-bottom: 20px;
            }
            
            .brand-title {
                font-size: 24px;
            }
            
            .brand-features {
                display: none;
            }
            
            .login-form-panel {
                padding: 40px 30px;
            }
            
            .form-header h2 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .login-wrapper {
                margin: 10px;
                border-radius: 16px;
            }
            
            .login-brand {
                padding: 30px 20px;
            }
            
            .login-form-panel {
                padding: 30px 20px;
            }
            
            .input-group input {
                padding: 14px 14px 14px 42px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-grid"></div>
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
    </div>

    <!-- Login Container -->
    <div class="login-wrapper">
        <!-- Brand Panel -->
        <div class="login-brand">
            <img src="https://i.postimg.cc/N0xVCmRx/Chat-GPT-Image-May-20-2026-06-42-05-PM.png" alt="Phantom FF" class="brand-logo">
            <h1 class="brand-title">PHANTOM <span>FF</span></h1>
            <p class="brand-subtitle">LEAGUE</p>
            
            <div class="brand-features">
                <div class="brand-feature">
                    <i class="fas fa-trophy"></i>
                    <span>Premium Tournaments</span>
                </div>
                <div class="brand-feature">
                    <i class="fas fa-crown"></i>
                    <span>Live Leaderboards</span>
                </div>
                <div class="brand-feature">
                    <i class="fas fa-wallet"></i>
                    <span>Instant Rewards</span>
                </div>
            </div>
        </div>

        <!-- Form Panel -->
        <div class="login-form-panel">
            <div class="form-header">
                <h2>WELCOME BACK</h2>
                <p>Login to continue your journey</p>
            </div>

            <div class="error-alert" id="errorAlert">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage"></span>
            </div>

            <div class="success-alert" id="successAlert">
                <i class="fas fa-check-circle"></i>
                <span>Login successful! Redirecting...</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                        <i class="fas fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="btnText">LOGIN</span>
                </button>
            </form>

            <div class="form-footer">
                <p>Don't have an account? <a href="signup.html">Create Account</a></p>
            </div>

            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </div>

    <script>
        // API Configuration
        const API_URL = window.location.origin + '/api';

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const successAlert = document.getElementById('successAlert');
            
            // Reset alerts
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            
            // Validate
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            // Loading state
            submitBtn.disabled = true;
            btnText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LOGGING IN...';
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Remember me
                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('rememberedEmail', email);
                    }
                    
                    // Show success
                    successAlert.style.display = 'block';
                    btnText.innerHTML = '<i class="fas fa-check"></i> SUCCESS!';
                    submitBtn.style.background = 'linear-gradient(135deg, #10B981, #059669)';
                    
                    // Redirect
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    
                } else {
                    showError(data.error || 'Invalid email or password');
                    submitBtn.disabled = false;
                    btnText.textContent = 'LOGIN';
                }
            } catch (error) {
                showError('Connection error. Please check your internet.');
                submitBtn.disabled = false;
                btnText.textContent = 'LOGIN';
            }
        });

        // Helper Functions
        function showError(message) {
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorAlert.style.display = 'block';
            errorAlert.style.animation = 'none';
            errorAlert.offsetHeight;
            errorAlert.style.animation = 'shake 0.5s';
        }

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Load remembered email
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
            
            // Check if already logged in
            const token = localStorage.getItem('authToken');
            if (token) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
